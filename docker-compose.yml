services:

  app:
    build: .
    container_name: hackazon_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:jKZq+W0ItdSUVjpc6heLukb9PVs7O4v7EP0korSUdbk=
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: hackazon
      DB_USERNAME: hackazon
      DB_PASSWORD: hackazon
      SESSION_DRIVER: file
      CACHE_STORE: file
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hackazon

  db:
    image: mysql:8.0
    container_name: hackazon_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hackazon
      MYSQL_USER: hackazon
      MYSQL_PASSWORD: hackazon
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      # Persistent data volume
      - db_data:/var/lib/mysql
      # Init scripts — executed once on first startup (in filename order)
      - ./database/hackazon_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/migration_coupons.sql:/docker-entrypoint-initdb.d/02_migration_coupons.sql:ro
      - ./database/migration_credit_card.sql:/docker-entrypoint-initdb.d/03_migration_credit_card.sql:ro
      - ./database/hackazon_demo_data.sql:/docker-entrypoint-initdb.d/04_demo_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "hackazon", "-phackazon"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - hackazon

volumes:
  db_data:
  app_storage:

networks:
  hackazon:
    driver: bridge
